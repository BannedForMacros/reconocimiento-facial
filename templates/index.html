<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Comedor UNPRG</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --azul-primary: #004a8f;
            --azul-dark: #002a52;
            --amarillo: #ffd700;
            --blanco: #ffffff;
            --gris-fondo: #f0f2f5;
            --text-dark: #333;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #ffc107;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--gris-fondo);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-card {
            background: var(--blanco);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 74, 143, 0.15);
            width: 100%;
            max-width: 900px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- HEADER --- */
        .header {
            background: linear-gradient(135deg, var(--azul-primary) 0%, var(--azul-dark) 100%);
            color: var(--blanco);
            padding: 25px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .header-content h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .header-content p {
            font-size: 0.9rem;
            opacity: 0.8;
            font-weight: 300;
        }

        .admin-link {
            background: rgba(255, 255, 255, 0.1);
            color: var(--blanco);
            padding: 8px 16px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .admin-link:hover {
            background: var(--amarillo);
            color: var(--azul-dark);
            border-color: var(--amarillo);
        }

        /* --- BODY --- */
        .content-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr; /* Video más grande que info */
            gap: 30px;
            padding: 40px;
        }

        /* Responsive para móviles */
        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        /* --- VIDEO AREA --- */
        .video-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .camera-wrapper {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            background: #000;
            aspect-ratio: 4/3;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Efecto espejo */
        }

        /* Animación de escaneo */
        .scan-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0, 255, 0, 0), rgba(0, 255, 0, 0.2) 50%, rgba(0, 255, 0, 0));
            border-bottom: 2px solid #00ff00;
            animation: scan 2s linear infinite;
            pointer-events: none;
            opacity: 0.6;
        }

        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        .live-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(220, 53, 69, 0.8);
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* --- INFO AREA --- */
        .info-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Tarjeta de Estado (Feedback) */
        .status-card {
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 25px;
            transition: all 0.4s ease;
            border: 2px solid transparent;
        }

        .status-card.waiting {
            background: #fff;
            border-color: #e0e0e0;
            color: #777;
        }

        .status-card.success {
            background: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
            animation: slideIn 0.4s ease-out;
        }

        .status-card.error {
            background: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
            animation: shake 0.4s ease-in-out;
        }

        .status-card.spoofing {
            background: #fff3cd;
            border-color: #ffeeba;
            color: #856404;
            animation: shake 0.4s ease-in-out;
        }

        .status-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
            display: block;
        }

        .status-title {
            font-weight: 700;
            font-size: 1.2rem;
        }

        /* Detalles del Usuario (Estilo ID Card) */
        .user-details {
            display: none; /* Oculto por defecto */
            background: white;
            border: 1px solid #eee;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: var(--azul-primary);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .detail-value {
            font-weight: 500;
            color: var(--text-dark);
            text-align: right;
        }

        /* Badge de Comida */
        .meal-badge {
            display: block;
            text-align: center;
            padding: 10px;
            margin-top: 15px;
            border-radius: 8px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .meal-badge.desayuno { background: #fff8c4; color: #b78900; }
        .meal-badge.almuerzo { background: #d0f0fd; color: #0077a3; }
        .meal-badge.cena { background: #d1e7dd; color: #0f5132; }

        /* Botón de Registro */
        .action-area {
            margin-top: auto;
            padding-top: 20px;
        }

        .btn-register {
            display: block;
            width: 100%;
            padding: 15px;
            background: var(--azul-primary);
            color: white;
            text-align: center;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0, 74, 143, 0.2);
        }

        .btn-register:hover {
            background: var(--azul-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 74, 143, 0.3);
        }

        /* Keyframes */
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

    </style>
</head>
<body>

    <div class="main-card">
        <div class="header">
            <div class="header-content">
                <h1>Sistema de Comedor</h1>
                <p>Facultad de Ingeniería de Sistemas - UNPRG</p>
            </div>
            <a href="/login" class="admin-link"><i class="fas fa-lock"></i> Admin</a>
        </div>

        <div class="content-grid">
            <div class="video-section">
                <div class="camera-wrapper">
                    <div class="live-badge"><div class="live-dot"></div> EN VIVO</div>
                    <div class="scan-overlay"></div>
                    <video id="video" autoplay muted playsinline></video>
                    <canvas id="canvas" style="display:none;"></canvas>
                </div>
            </div>

            <div class="info-section">
                
                <div id="statusCard" class="status-card waiting">
                    <i class="fas fa-user-clock status-icon"></i>
                    <div class="status-title">Escaneando rostro...</div>
                    <div style="font-size: 0.9rem; margin-top: 5px; opacity: 0.7;">Por favor, mira a la cámara</div>
                </div>

                <div id="userDetails" class="user-details">
                    <div class="detail-row">
                        <span class="detail-label"><i class="fas fa-id-card"></i> DNI</span>
                        <span class="detail-value" id="valDni">--</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label"><i class="fas fa-user"></i> Nombre</span>
                        <span class="detail-value" id="valNombre">--</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label"><i class="fas fa-chart-line"></i> Confianza</span>
                        <span class="detail-value" id="valConfianza">--%</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label"><i class="fas fa-shield-alt"></i> Seguridad</span>
                        <span class="detail-value" id="valLiveness">--</span>
                    </div>
                    
                    <div id="mealBadge" class="meal-badge">--</div>
                </div>

                <div class="action-area">
                    <a href="/registro" class="btn-register">
                        <i class="fas fa-user-plus"></i> Registrar Nuevo Comensal
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusCard = document.getElementById('statusCard');
        const userDetails = document.getElementById('userDetails');
        
        let isProcessing = false;

        // Configuración de la cámara
        navigator.mediaDevices.getUserMedia({ 
            video: { 
                width: 640, 
                height: 480, 
                facingMode: 'user' 
            } 
        })
        .then(stream => {
            video.srcObject = stream;
            // Iniciar ciclo de reconocimiento
            setInterval(reconocer, 2000);
        })
        .catch(err => {
            updateStatus('error', 'fa-video-slash', 'Error de Cámara', 'No se pudo acceder al dispositivo.');
        });

        async function reconocer() {
            if (isProcessing) return;
            isProcessing = true;
            
            try {
                // Capturar frame
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0);
                
                // Convertir a blob para enviar
                const fotoBase64 = canvas.toDataURL('image/jpeg');
                const blob = await (await fetch(fotoBase64)).blob();
                const formData = new FormData();
                formData.append('foto', blob, 'frame.jpg');
                
                // Petición al backend
                const response = await fetch('/api/reconocer', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // ÉXITO
                    updateStatus('success', 'fa-check-circle', 'Acceso Permitido', data.message);
                    showUserDetails(data);
                    
                    // Resetear después de 5 segundos
                    setTimeout(resetInterface, 5000);
                    
                } else {
                    // ERROR O SPOOFING
                    if (data.message && data.message.toLowerCase().includes('spoofing')) {
                        updateStatus('spoofing', 'fa-mask', 'Intento de Suplantación', 'Prueba de vida fallida.');
                    } else {
                        // Si es solo "no reconocido", a veces es mejor no mostrar error rojo constante, 
                        // sino mantener "Escaneando" o un warning suave. 
                        // Aquí mostramos error brevemente si el backend dice explícitamente que falló algo crítico.
                        if(data.message !== "No se detectó rostro") {
                             updateStatus('error', 'fa-times-circle', 'No Reconocido', data.message);
                        } else {
                            resetInterface(); // Volver a escanear silenciosamente
                        }
                    }
                    
                    userDetails.style.display = 'none';
                    if(data.message !== "No se detectó rostro") setTimeout(resetInterface, 3000);
                }
                
            } catch (error) {
                console.error('Error de red:', error);
            } finally {
                isProcessing = false;
            }
        }

        function showUserDetails(data) {
            document.getElementById('valDni').textContent = data.comensal.dni;
            document.getElementById('valNombre').textContent = `${data.comensal.nombre} ${data.comensal.apellido}`;
            document.getElementById('valConfianza').textContent = Math.round(data.confianza) + '%';
            document.getElementById('valLiveness').textContent = data.liveness_score;
            
            const badge = document.getElementById('mealBadge');
            const comida = data.comida ? data.comida.toLowerCase() : '';
            badge.textContent = data.comida ? data.comida.toUpperCase() : 'HORARIO NO VÁLIDO';
            badge.className = `meal-badge ${comida}`;
            
            userDetails.style.display = 'block';
        }

        function updateStatus(type, icon, title, subtitle) {
            statusCard.className = `status-card ${type}`;
            statusCard.innerHTML = `
                <i class="fas ${icon} status-icon"></i>
                <div class="status-title">${title}</div>
                <div style="font-size: 0.9rem; margin-top: 5px;">${subtitle}</div>
            `;
        }

        function resetInterface() {
            userDetails.style.display = 'none';
            statusCard.className = 'status-card waiting';
            statusCard.innerHTML = `
                <i class="fas fa-user-clock status-icon"></i>
                <div class="status-title">Escaneando rostro...</div>
                <div style="font-size: 0.9rem; margin-top: 5px; opacity: 0.7;">Por favor, mira a la cámara</div>
            `;
        }
    </script>
</body>
</html>
