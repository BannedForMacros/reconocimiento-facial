<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reconocimiento - Sistema Comedor UNPRG</title>
    <style>
        :root {
            --primary-blue: #004a8f;
            --secondary-yellow: #ffd700;
            --background-light: #f4f7fa;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: var(--background-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 700px;
            width: 100%;
            padding: 30px;
            border-top: 6px solid var(--primary-blue);
            text-align: center;
        }
        h1 {
            color: var(--primary-blue);
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .video-container {
            position: relative;
            margin-bottom: 20px;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
            border: 3px solid var(--primary-blue);
        }
        #video {
            width: 100%;
            height: auto;
            display: block;
        }
        canvas { display: none; }
        .status {
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .status.waiting {
            background: #e3f2fd;
            color: #1976d2;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            animation: pulse 0.5s;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        .status.spoofing {
            background: #fff3cd;
            color: #856404;
            border: 2px solid #ffc107;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .info-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: left;
        }
        .info-box p {
            margin: 5px 0;
            color: #666;
        }
        .info-box strong {
            color: var(--primary-blue);
        }
        .btn-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
        .btn-link:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Sistema de Reconocimiento Facial</h1>
        <p class="subtitle">Coloca tu rostro frente a la cámara</p>
        
        <div class="video-container">
            <video id="video" autoplay></video>
            <canvas id="canvas"></canvas>
        </div>
        
        <div id="status" class="status waiting">
            Esperando detección...
        </div>
        
        <div id="infoBox" class="info-box" style="display: none;">
            <p><strong>DNI:</strong> <span id="infoDni"></span></p>
            <p><strong>Nombre:</strong> <span id="infoNombre"></span></p>
            <p><strong>Confianza:</strong> <span id="infoConfianza"></span>%</p>
            <p><strong>Liveness:</strong> <span id="infoLiveness"></span></p>
        </div>
        
        <a href="/registro" class="btn-link">Registrar nuevo usuario</a>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');
        const infoBox = document.getElementById('infoBox');
        
        let isProcessing = false;

        // Iniciar webcam
        navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } })
            .then(stream => {
                video.srcObject = stream;
                // Reconocer cada 2 segundos
                setInterval(reconocer, 2000);
            })
            .catch(err => {
                status.textContent = '❌ No se pudo acceder a la cámara';
                status.className = 'status error';
            });

        async function reconocer() {
            if (isProcessing) return;
            isProcessing = true;
            
            try {
                // Capturar frame
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0);
                const fotoBase64 = canvas.toDataURL('image/jpeg');
                
                // Convertir a blob
                const blob = await (await fetch(fotoBase64)).blob();
                const formData = new FormData();
                formData.append('foto', blob, 'frame.jpg');
                
                // Enviar al servidor
                const response = await fetch('/api/reconocer', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Match exitoso
                    status.textContent = `✅ ${data.message}`;
                    status.className = 'status success';
                    
                    // Mostrar info
                    document.getElementById('infoDni').textContent = data.comensal.dni;
                    document.getElementById('infoNombre').textContent = 
                        `${data.comensal.nombre} ${data.comensal.apellido}`;
                    document.getElementById('infoConfianza').textContent = data.confianza;
                    document.getElementById('infoLiveness').textContent = data.liveness_score;
                    infoBox.style.display = 'block';
                    
                    // Volver a esperar después de 5 segundos
                    setTimeout(() => {
                        status.textContent = 'Esperando detección...';
                        status.className = 'status waiting';
                        infoBox.style.display = 'none';
                    }, 5000);
                    
                } else {
                    // No reconocido o spoofing
                    if (data.message.includes('spoofing')) {
                        status.textContent = data.message;
                        status.className = 'status spoofing';
                    } else {
                        status.textContent = data.message;
                        status.className = 'status error';
                    }
                    
                    setTimeout(() => {
                        status.textContent = 'Esperando detección...';
                        status.className = 'status waiting';
                    }, 3000);
                }
                
            } catch (error) {
                console.error('Error:', error);
            } finally {
                isProcessing = false;
            }
        }
    </script>
</body>
</html>
